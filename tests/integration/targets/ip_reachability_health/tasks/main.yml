---
- name: Start IP Reachability integration tests
  ansible.builtin.debug:
    msg: "Running IP Reachability checks on {{ inventory_hostname }}"

- name: Run ip_reachability role with explicit count
  ansible.builtin.include_role:
    name: network.healthchecks.ip_reachability
  vars:
    ip_targets:
      - 192.0.2.1
      - 198.51.100.1
    count: 2
  register: reachability_result

- name: Display reachability results with explicit count
  ansible.builtin.debug:
    var: hostvars[inventory_hostname].ip_reachability

- name: Run ip_reachability role with default count
  ansible.builtin.include_role:
    name: network.healthchecks.ip_reachability
  vars:
    ip_targets:
      - 192.0.2.1
      - 198.51.100.1
  register: default_count_result

- name: Display reachability results with default count
  ansible.builtin.debug:
    var: hostvars[inventory_hostname].ip_reachability

- name: Debug
  ansible.builtin.debug:
    msg: "END network.ip_reachability health_check operation integration tests on connection={{ ansible_connection }}"
