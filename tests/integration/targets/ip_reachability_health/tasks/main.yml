---
- name: Start IP Reachability integration tests
  ansible.builtin.debug:
    msg: "Running IP Reachability checks on {{ inventory_hostname }}"

- name: Run ip_reachability role
  ansible.builtin.include_role:
    name: network.healthchecks.ip_reachability
  vars:
    ip_targets:
      - 192.0.2.1
      - 198.51.100.1
    count: 2
  register: reachability_result

- name: Check role execution
  ansible.builtin.assert:
    that:
      - reachability_result is defined
    fail_msg: "Role execution failed"

- name: Debug
  ansible.builtin.debug:
    msg: "END network.ip_reachability health_check operation integration tests on connection={{ ansible_connection }}"
