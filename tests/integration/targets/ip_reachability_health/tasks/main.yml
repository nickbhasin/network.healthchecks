---
- name: Start IP Reachability integration tests
  ansible.builtin.debug:
    msg: "Running IP Reachability checks on {{ inventory_hostname }}"

- name: Run ip_reachability role
  ansible.builtin.include_role:
    name: network.healthchecks.ip_reachability
  vars:
    ip_targets:
      - 8.8.8.8
      - 1.1.1.1
    count: 2
  register: reachability_result

- name: Check unreachable IPs
  ansible.builtin.assert:
    that:
      - reachability_result.ip_reachability.unreachable_targets | length == 0
    fail_msg: "Some IPs were unreachable: {{ reachability_result.ip_reachability.unreachable_targets | join(', ') }}"

- name: Check reachability status
  ansible.builtin.assert:
    that:
      - reachability_result.ip_reachability.status == "PASS"
    fail_msg: "Reachability check failed with status: {{ reachability_result.ip_reachability.status }}"

- name: Check overall result
  ansible.builtin.assert:
    that:
      - reachability_result == "PASS"
    fail_msg: "Overall result check failed with status: {{ reachability_result.result }}"
