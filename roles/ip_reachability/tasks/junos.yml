---
- name: Ping targets from Junos device
  junipernetworks.junos.junos_ping:
    dest: "{{ item }}"
    count: 3
  register: ping_result
  loop: "{{ ip_targets }}"
  ignore_errors: true

- name: Collect unreachable IPs (Junos)
  ansible.builtin.set_fact:
    unreachable_ips: "{{ unreachable_ips | default([]) + [item.item] }}"
  when: item.failed
  loop: "{{ ping_result.results }}"
