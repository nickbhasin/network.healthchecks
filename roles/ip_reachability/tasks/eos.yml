---
- name: Ping targets from EOS device
  arista.eos.eos_ping:
    dest: "{{ item }}"
    count: "{{ count | default(2) }}"
  register: ping_result
  loop: "{{ ip_targets }}"
  ignore_errors: true

- name: Collect unreachable IPs (EOS)
  ansible.builtin.set_fact:
    unreachable_ips: "{{ unreachable_ips | default([]) + [item.item] }}"
  when: item.failed
  loop: "{{ ping_result.results }}"

- name: Collect reachable IPs (EOS)
  ansible.builtin.set_fact:
    reachable_ips: "{{ reachable_ips | default([]) + [item.item] }}"
  when: not item.failed
  loop: "{{ ping_result.results }}"
